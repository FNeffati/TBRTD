version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: tbrtd-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./src/backEnd
    container_name: tbrtd-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongodb_data:
